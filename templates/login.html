<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intrastat PDF Extractor — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Georgia', serif;
      background: #F5F0E8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #FEFCF9;
      border: 1px solid #D4C5A9;
      border-radius: 12px;
      padding: 48px 40px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 24px rgba(139,115,85,0.10);
      text-align: center;
    }

    .logo {
      font-size: 13px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #8B7355;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 22px;
      color: #3D2B1F;
      margin-bottom: 32px;
      font-weight: normal;
    }

    label {
      display: block;
      text-align: left;
      font-size: 11px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #8B7355;
      margin-bottom: 6px;
    }

    input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #D4C5A9;
      border-radius: 8px;
      font-size: 15px;
      background: #FAF7F2;
      color: #3D2B1F;
      outline: none;
      transition: border-color .2s;
      margin-bottom: 20px;
    }

    input[type="password"]:focus {
      border-color: #8B7355;
    }

    .error {
      background: #FEF0EE;
      border: 1px solid #E8C5BE;
      color: #8B3A2F;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      background: #8B7355;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: .04em;
      transition: background .2s;
    }

    button:hover { background: #7A6347; }

    footer {
      margin-top: 32px;
      font-size: 11px;
      color: #B8A898;
      letter-spacing: .06em;
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="logo">Intrastat PDF Extractor</p>
    <h1>Aanmelden</h1>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post">
      <label for="password">Wachtwoord</label>
      <input type="password" id="password" name="password" autofocus autocomplete="current-password" placeholder="••••••••">
      <button type="submit">Aanmelden</button>
    </form>
  </div>

  <footer>Made by Lander Smits</footer>
</body>
</html>
